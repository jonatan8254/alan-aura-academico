<text x="394.3" y="1013.0" font-size="9.5" fill="#2C2C2A">PER-T3 y RN-03.5 se realizan como una AUSENCIA, y esa es la afirmacion.</text>
<text x="394.3" y="1026.0" font-size="9.5" fill="#2C2C2A">En todo el diagrama no existe ningun mensaje hacia `CapsulaDePerfil`,</text>
<text x="394.3" y="1039.0" font-size="9.5" fill="#2C2C2A">`Mensaje` ni `Personaje`, y ninguno lee el username completo ni las respuestas de</text>
<text x="394.3" y="1052.0" font-size="9.5" fill="#2C2C2A">encuesta. No hay «filtro que oculta»: sencillamente no hay camino que alcance esos</text>
<text x="394.3" y="1065.0" font-size="9.5" fill="#2C2C2A">datos. Ninguna consulta administrativa puede llegar a ellos por construccion.</text>
<text x="394.3" y="1078.0" font-size="9.5" fill="#2C2C2A">El `estado` es DERIVADO, no almacenado (PER-T4, SD-26): se calcula del</text>
<text x="394.3" y="1091.0" font-size="9.5" fill="#2C2C2A">`Consentimiento` en cada consulta y su dominio es {activo, sin consentimiento</text>
<text x="394.3" y="1104.0" font-size="9.5" fill="#2C2C2A">vigente}. No es suspension ni sancion.</text>
<text x="394.3" y="1117.0" font-size="9.5" fill="#2C2C2A">FA-01 y FA-02 existen y `DR-08` los dibuja, pese a que la nota en prosa de ese</text>
<text x="394.3" y="1130.0" font-size="9.5" fill="#2C2C2A">mismo archivo diga «no aplica». Contradiccion interna reportada a</text>
<text x="394.3" y="1143.0" font-size="9.5" fill="#2C2C2A">`/uml-robustness-diagram`; aqui se sigue a las flechas y a `ECU-08` §6, que coinciden.</text>
