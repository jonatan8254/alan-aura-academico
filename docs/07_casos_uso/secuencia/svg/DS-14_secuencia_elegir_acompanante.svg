<text x="507.1" y="920.0" font-size="10" fill="#2C2C2A">devolverControlACU05()</text>
<rect x="481.1" y="384.0" width="460.0" height="81.0" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1" rx="3"/>
<text x="489.1" y="402.0" font-size="9.5" fill="#2C2C2A">El actor entra en el paso 2, no en el 1. El paso 1 lo ejecuta el sistema:</text>
<text x="489.1" y="415.0" font-size="9.5" fill="#2C2C2A">es CU-05 quien dispara este caso de uso por &lt;&lt;include&gt;&gt;, no el Usuario. Por eso</text>
<text x="489.1" y="428.0" font-size="9.5" fill="#2C2C2A">CU-14 no cuelga de ningun actor en DCU-01 v2.1.</text>
<text x="489.1" y="441.0" font-size="9.5" fill="#2C2C2A">Alan y Aura como entidades distintas: este es el unico punto del sistema</text>
<text x="489.1" y="454.0" font-size="9.5" fill="#2C2C2A">donde se distinguen como objetos. Cada uno describe su propio rol y estilo.</text>
<rect x="1406.9" y="971.0" width="556.2" height="133.0" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1" rx="3"/>
<text x="1414.9" y="989.0" font-size="9.5" fill="#2C2C2A">El paso 2 usa el supertipo Personaje, no Alan ni Aura: lo que se fija en la</text>
<text x="1414.9" y="1002.0" font-size="9.5" fill="#2C2C2A">capsula es el interlocutor, no la subclase concreta.</text>
<text x="1414.9" y="1015.0" font-size="9.5" fill="#2C2C2A">Invariante de RN-01.6, y se cumple aqui, no en DS-05: al terminar, la</text>
<text x="1414.9" y="1028.0" font-size="9.5" fill="#2C2C2A">CapsulaDePerfil existe y tiene character como contenido minimo. En la ruta</text>
<text x="1414.9" y="1041.0" font-size="9.5" fill="#2C2C2A">FA-01 de CU-05 no se pasa por «armar la capsula» y aun asi este caso de uso la</text>
<text x="1414.9" y="1054.0" font-size="9.5" fill="#2C2C2A">escribe. Lo persistido es la ultima eleccion y actua como predeterminado: usar el</text>
<text x="1414.9" y="1067.0" font-size="9.5" fill="#2C2C2A">otro Personaje en sesion es CU-13, y no reescribe la capsula.</text>
<text x="1414.9" y="1080.0" font-size="9.5" fill="#2C2C2A">FA-01 no deja rastro: no hay ningun mensaje de escritura antes de la</text>
<text x="1414.9" y="1093.0" font-size="9.5" fill="#2C2C2A">confirmacion, asi que lo descartado no existe en ninguna parte.</text>
