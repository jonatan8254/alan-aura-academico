<rect x="463.6" y="520.0" width="460.0" height="55.0" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1" rx="3"/>
<text x="471.6" y="538.0" font-size="9.5" fill="#2C2C2A">Sin objetos tipo Entidad persistentes. `Visitante` es clase de dominio</text>
<text x="471.6" y="551.0" font-size="9.5" fill="#2C2C2A">(MD-01 v1.4) pero aqui solo se identifica: no se captura ningun dato y no se</text>
<text x="471.6" y="564.0" font-size="9.5" fill="#2C2C2A">crea sesion. La ausencia de todo mensaje de escritura es la postcondicion.</text>
<rect x="760.4" y="985.0" width="486.9" height="120.0" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1" rx="3"/>
<text x="768.4" y="1003.0" font-size="9.5" fill="#2C2C2A">FA-01 continua en CU-02 y FA-02 en CU-03. Ambos son destinos de</text>
<text x="768.4" y="1016.0" font-size="9.5" fill="#2C2C2A">continuacion, no comportamiento de este caso de uso: aqui solo se dirige.</text>
<text x="768.4" y="1029.0" font-size="9.5" fill="#2C2C2A">FE-02 vuelve al paso 1, no empuja al formulario (SD-30, hallazgo H-8</text>
<text x="768.4" y="1042.0" font-size="9.5" fill="#2C2C2A">resuelto a favor de ECU-01): al Visitante se le ensena donde esta y se le</text>
<text x="768.4" y="1055.0" font-size="9.5" fill="#2C2C2A">ofrece registrarse, en vez de llevarlo a un formulario que no pidio. Lo dice</text>
<text x="768.4" y="1068.0" font-size="9.5" fill="#2C2C2A">ECU-01 en su §6, en la fila de FE-02 y en CA-08.</text>
<text x="768.4" y="1081.0" font-size="9.5" fill="#2C2C2A">Traza: RF-19 -&gt; OBJ-7. Reglas: RN-04.5 (el Visitante solo consulta</text>
<text x="768.4" y="1094.0" font-size="9.5" fill="#2C2C2A">la presentacion) y RN-09 (el disclosure precede a la primera conversacion).</text>
