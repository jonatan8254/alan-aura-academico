<text x="1548.2" y="1521.0" font-size="9.5" fill="#2C2C2A">La consecuencia aceptada y documentada (SD-26): como `character` vive en la</text>
<text x="1548.2" y="1534.0" font-size="9.5" fill="#2C2C2A">capsula y esta deja de existir, el Usuario queda sin poder conversar hasta</text>
<text x="1548.2" y="1547.0" font-size="9.5" fill="#2C2C2A">rehacer CU-05. No es un efecto colateral: es lo que el paso 4 declara por escrito.</text>
<text x="1548.2" y="1560.0" font-size="9.5" fill="#2C2C2A">FE-04 sin estados intermedios (RE-04): o la capsula desaparece entera o</text>
<text x="1548.2" y="1573.0" font-size="9.5" fill="#2C2C2A">queda como estaba, con `character`. Ninguna rama la deja a medias.</text>
