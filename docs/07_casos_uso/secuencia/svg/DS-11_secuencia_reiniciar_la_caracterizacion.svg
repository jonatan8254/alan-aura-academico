<text x="389.4" y="144.0" font-size="9.5" fill="#2C2C2A">PER-T7 - reiniciar NO es revocar. Reiniciar borra la CapsulaDePerfil</text>
<text x="389.4" y="157.0" font-size="9.5" fill="#2C2C2A">entera, incluido `character`, y por eso el Usuario pierde el acceso al chat</text>
<text x="389.4" y="170.0" font-size="9.5" fill="#2C2C2A">hasta rehacer CU-05. Revocar la personalizacion (CU-12, DS-12) solo hace que deje de</text>
<text x="389.4" y="183.0" font-size="9.5" fill="#2C2C2A">alimentar la conversacion y no es punitivo. Dos operaciones distintas sobre</text>
<text x="389.4" y="196.0" font-size="9.5" fill="#2C2C2A">estados distintos.</text>
