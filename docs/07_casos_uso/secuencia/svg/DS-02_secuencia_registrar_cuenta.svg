<rect x="421.2" y="304.0" width="460.0" height="68.0" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1" rx="3"/>
<text x="429.2" y="322.0" font-size="9.5" fill="#2C2C2A">RN-04.1 se realiza como una AUSENCIA. No hay ningun mensaje que pida</text>
<text x="429.2" y="335.0" font-size="9.5" fill="#2C2C2A">nombre legal, documento, correo, telefono, direccion ni fecha de nacimiento.</text>
<text x="429.2" y="348.0" font-size="9.5" fill="#2C2C2A">Esos campos no existen en el diagrama, y esa es la afirmacion.</text>
<text x="429.2" y="361.0" font-size="9.5" fill="#2C2C2A">RN-04.6: tampoco hay recuperacion de contrasena por correo ni verificacion.</text>
<rect x="698.2" y="1162.0" width="1009.8" height="107.0" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1" rx="3"/>
<text x="706.2" y="1180.0" font-size="9.5" fill="#2C2C2A">El hasheo y la asignacion de rol son restricciones de `crearCuenta`, no pasos</text>
<text x="706.2" y="1193.0" font-size="9.5" fill="#2C2C2A">aparte (PRIV-R12, RNF-08): sacarlos a mensajes propios habria metido mecanismo</text>
<text x="706.2" y="1206.0" font-size="9.5" fill="#2C2C2A">en un diagrama de diseno que aun no decide infraestructura.</text>
<text x="706.2" y="1219.0" font-size="9.5" fill="#2C2C2A">Postcondicion: existe un `Usuario` con rol de usuario asignado en el servidor,</text>
<text x="706.2" y="1232.0" font-size="9.5" fill="#2C2C2A">aun sin Consentimiento ni CapsulaDePerfil — esos los crea CU-05.</text>
<text x="706.2" y="1245.0" font-size="9.5" fill="#2C2C2A">Hallazgo heredado de DR-02 (RA-01): DIS-00 §2 no declara ningun estado de</text>
<text x="706.2" y="1258.0" font-size="9.5" fill="#2C2C2A">exito para P-02, asi que `confirmarElAlta` no tiene pantalla real inventariada.</text>
