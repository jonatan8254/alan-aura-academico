<text x="318.1" y="144.0" font-size="9.5" fill="#2C2C2A">Invariante, y es lo esencial de este caso de uso: el Usuario SIGUE PUDIENDO</text>
<text x="318.1" y="157.0" font-size="9.5" fill="#2C2C2A">CONVERSAR. Revocar la personalizacion no es punitivo (RN-08). La capa base</text>
<text x="318.1" y="170.0" font-size="9.5" fill="#2C2C2A">permanece otorgada; lo unico que cesa es que los cuatro autorreportes orienten la</text>
<text x="318.1" y="183.0" font-size="9.5" fill="#2C2C2A">conversacion. `character` permanece, porque pertenece a la capa BASE (RN-01.6).</text>
<text x="318.1" y="196.0" font-size="9.5" fill="#2C2C2A">Contraste con CU-11 (DS-11), que borra la capsula entera: PER-T7.</text>
<rect x="1334.2" y="1469.0" width="561.8" height="81.0" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1" rx="3"/>
<text x="1342.2" y="1487.0" font-size="9.5" fill="#2C2C2A">PRIV-R3: los autorreportes quedan marcados para descarte, no borrados en</text>
<text x="1342.2" y="1500.0" font-size="9.5" fill="#2C2C2A">el acto. El diagrama lo dice con ese verbo y no con «suprimir», porque el momento del</text>
<text x="1342.2" y="1513.0" font-size="9.5" fill="#2C2C2A">descarte fisico es diseno de retencion y su sitio es `ARQ-01`.</text>
<text x="1342.2" y="1526.0" font-size="9.5" fill="#2C2C2A">Lo que NO existe aqui es la afirmacion: ningun mensaje toca la capa base, y</text>
<text x="1342.2" y="1539.0" font-size="9.5" fill="#2C2C2A">ninguno borra `character`. Por eso el chat sigue disponible.</text>
