<text x="1372.8" y="583.0" font-size="9.5" fill="#2C2C2A">La tasa tecnica se calcula sobre eventos SIN CONTENIDO (PER-01, plan</text>
<text x="1372.8" y="596.0" font-size="9.5" fill="#2C2C2A">§4.15):</text>
<text x="1372.8" y="609.0" font-size="9.5" fill="#2C2C2A">peticiones correctas mas fallback sobre el total. Es salud del</text>
<text x="1372.8" y="622.0" font-size="9.5" fill="#2C2C2A">servicio, no</text>
<text x="1372.8" y="635.0" font-size="9.5" fill="#2C2C2A">medida de personas. Umbral `RC-07` (MET-07) &gt;= 95 %.</text>
<rect x="383.6" y="1098.0" width="1361.9" height="94.0" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1" rx="3"/>
<text x="391.6" y="1116.0" font-size="9.5" fill="#2C2C2A">RN-03.3 y PRIV-R10 se realizan como una AUSENCIA. En todo el diagrama no hay</text>
<text x="391.6" y="1129.0" font-size="9.5" fill="#2C2C2A">ningun mensaje que pida un conteo por usuario ni contenido de conversacion:</text>
<text x="391.6" y="1142.0" font-size="9.5" fill="#2C2C2A">las cuatro lecturas son agregados sobre el conjunto. El Administrador no puede</text>
<text x="391.6" y="1155.0" font-size="9.5" fill="#2C2C2A">descender al individuo porque no existe camino que lo permita.</text>
<text x="391.6" y="1168.0" font-size="9.5" fill="#2C2C2A">Los ceros de FA-01 son una cifra valida, no un error: una ventana sin actividad</text>
<text x="391.6" y="1181.0" font-size="9.5" fill="#2C2C2A">se muestra, no se oculta ni se sustituye por un aviso de fallo.</text>
