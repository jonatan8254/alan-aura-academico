<text x="178.2" y="1203.0" font-size="10" fill="#2C2C2A">revisar las cifras agregadas mostradas</text>
<rect x="1138.8" y="565.0" width="380.8" height="211.0" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1" rx="3"/>
<text x="1146.8" y="583.0" font-size="9.5" fill="#2C2C2A">Las DOS cifras de ventana salen de aqui (v1.1, hallazgo H-1b de</text>
<text x="1146.8" y="596.0" font-size="9.5" fill="#2C2C2A">DS-00), porque</text>
<text x="1146.8" y="609.0" font-size="9.5" fill="#2C2C2A">se escribe un EventoOperativo por llamada al proveedor: contar sus</text>
<text x="1146.8" y="622.0" font-size="9.5" fill="#2C2C2A">registros de los</text>
<text x="1146.8" y="635.0" font-size="9.5" fill="#2C2C2A">ultimos 7 dias ES contar las llamadas al chat. Antes ese conteo salia</text>
<text x="1146.8" y="648.0" font-size="9.5" fill="#2C2C2A">de Conversacion,</text>
<text x="1146.8" y="661.0" font-size="9.5" fill="#2C2C2A">que no se persiste (RF-13) — a los siete dias no quedaba nada que</text>
<text x="1146.8" y="674.0" font-size="9.5" fill="#2C2C2A">contar.</text>
<text x="1146.8" y="687.0" font-size="9.5" fill="#2C2C2A">Las otras dos cifras son cardinalidades de Usuario, no salen de esta</text>
<text x="1146.8" y="700.0" font-size="9.5" fill="#2C2C2A">linea de vida.</text>
<text x="1146.8" y="713.0" font-size="9.5" fill="#2C2C2A">La tasa tecnica se calcula sobre eventos SIN CONTENIDO (PER-01, plan</text>
<text x="1146.8" y="726.0" font-size="9.5" fill="#2C2C2A">§4.15):</text>
<text x="1146.8" y="739.0" font-size="9.5" fill="#2C2C2A">peticiones correctas mas fallback sobre el total. Es salud del</text>
<text x="1146.8" y="752.0" font-size="9.5" fill="#2C2C2A">servicio, no</text>
<text x="1146.8" y="765.0" font-size="9.5" fill="#2C2C2A">medida de personas. Umbral `RC-07` (MET-07) &gt;= 95 %.</text>
<rect x="383.6" y="1228.0" width="1135.9" height="94.0" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1" rx="3"/>
<text x="391.6" y="1246.0" font-size="9.5" fill="#2C2C2A">RN-03.3 y PRIV-R10 se realizan como una AUSENCIA. En todo el diagrama no hay</text>
<text x="391.6" y="1259.0" font-size="9.5" fill="#2C2C2A">ningun mensaje que pida un conteo por usuario ni contenido de conversacion:</text>
<text x="391.6" y="1272.0" font-size="9.5" fill="#2C2C2A">las cuatro lecturas son agregados sobre el conjunto. El Administrador no puede</text>
<text x="391.6" y="1285.0" font-size="9.5" fill="#2C2C2A">descender al individuo porque no existe camino que lo permita.</text>
<text x="391.6" y="1298.0" font-size="9.5" fill="#2C2C2A">Los ceros de FA-01 son una cifra valida, no un error: una ventana sin actividad</text>
<text x="391.6" y="1311.0" font-size="9.5" fill="#2C2C2A">se muestra, no se oculta ni se sustituye por un aviso de fallo.</text>
