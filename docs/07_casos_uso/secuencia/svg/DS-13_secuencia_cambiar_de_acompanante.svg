<text x="1447.0" y="1084.0" font-size="9.5" fill="#2C2C2A">La capsula se consulta y no se escribe, y ese es el invariante.</text>
<text x="1447.0" y="1097.0" font-size="9.5" fill="#2C2C2A">`CapsulaDePerfil.character` no cambia: la sesion usa otro Personaje sin</text>
<text x="1447.0" y="1110.0" font-size="9.5" fill="#2C2C2A">reescribir la capsula (RN-01.6). En todo el caso de uso no existe ninguna</text>
<text x="1447.0" y="1123.0" font-size="9.5" fill="#2C2C2A">escritura persistida — la ausencia de todo mensaje de escritura es la afirmacion.</text>
<text x="1447.0" y="1136.0" font-size="9.5" fill="#2C2C2A">El gate de seguridad no aparece aqui, y tampoco es un olvido. Cambiar de</text>
<text x="1447.0" y="1149.0" font-size="9.5" fill="#2C2C2A">Personaje modula el tono, no las reglas de seguridad (RN-02.4): el gate y las</text>
<text x="1447.0" y="1162.0" font-size="9.5" fill="#2C2C2A">guardas de salida pertenecen a CU-06 y se dibujan en DS-06. Que este diagrama no</text>
<text x="1447.0" y="1175.0" font-size="9.5" fill="#2C2C2A">tenga ninguna frontera con el Proveedor LLM lo hace verificable de un vistazo.</text>
